name: Daily Stats Update
on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch & write stats
        run: |
          mkdir -p data
          jq -n \
            --arg updated "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg repos "$(curl -s https://api.github.com/users/ibqy | jq -r '.public_repos // 0')" \
            --arg followers "$(curl -s https://api.github.com/users/ibqy | jq -r '.followers // 0')" \
            --arg stars "$(curl -s "https://api.github.com/users/ibqy/repos?per_page=100&type=public" | jq '[.[].stargazers_count] // [] | add // 0')" \
            '{updated:$updated,public_repos:($repos|tonumber),followers:($followers|tonumber),total_stars:($stars|tonumber)}' \
            > data/stats.json

      - name: Commit & push
        run: |
          git config user.name "ibqy[bot]"
          git config user.email "bot@ibqy.dev"
          git add data/stats.json
          git diff --cached --quiet && echo "No changes" || {
            git commit -m "auto: refresh stats [skip ci]"
            git push
          }