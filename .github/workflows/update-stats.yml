name: Daily Stats Update
on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch stats from GitHub API
        run: |
          mkdir -p data
          USER_DATA=$(curl -s https://api.github.com/users/ibqy)
          REPOS=$(echo "$USER_DATA" | jq -r '.public_repos // 0')
          FOLLOWERS=$(echo "$USER_DATA" | jq -r '.followers // 0')
          STARS=$(curl -s "https://api.github.com/users/ibqy/repos?per_page=100&type=public" \
            | jq '[.[].stargazers_count] | add // 0')

          cat > data/stats.json <<EOF
      {
        "updated": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
        "public_repos": $REPOS,
        "followers": $FOLLOWERS,
        "total_stars": $STARS
      }
      EOF

      - name: Commit & push
        run: |
          git config user.name "ibqy[bot]"
          git config user.email "bot@ibqy.dev"
          git add data/stats.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "auto: refresh stats [skip ci]"
            git push
          fi